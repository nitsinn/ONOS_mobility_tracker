services:
  onos:
    image: onosproject/onos:2.7.0
    platform: linux/amd64
    container_name: onos
    hostname: onos
    restart: unless-stopped
    ports:
      - "6653:6653"   # OpenFlow
      - "6640:6640"   # OVSDB
      - "8181:8181"   # GUI
      - "8101:8101"   # ONOS CLI
      - "9876:9876"   # Intra-cluster communication
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/onos/ui"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    volumes:
      - onos-data:/root/onos/var
      - onos-config:/root/onos/config

volumes:
  onos-data:
    driver: local
  onos-config:
    driver: local